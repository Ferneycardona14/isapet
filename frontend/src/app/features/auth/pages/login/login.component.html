<section class="login-page">
  <div class="login-card">
    <p class="eyebrow">Acceso administrativo</p>
    <h1>Iniciar sesión</h1>
    <p class="intro">Ingresa con tu cuenta de administrador para gestionar ISAPET.</p>

    @if (error) {
      <div class="alert" role="alert">{{ error }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field" for="username">
        Usuario
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          maxlength="100"
          [attr.aria-invalid]="form.controls.username.invalid && form.controls.username.touched"
        />
        @if (form.controls.username.invalid && form.controls.username.touched) {
          <span class="field-error">Ingresa tu nombre de usuario.</span>
        }
      </label>

      <label class="field" for="password">
        Contraseña
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          maxlength="72"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="field-error">Ingresa tu contraseña.</span>
        }
      </label>

      <button class="submit-button" type="submit" [disabled]="submitting">
        {{ submitting ? 'Validando…' : 'Entrar' }}
      </button>
    </form>
  </div>
</section>
