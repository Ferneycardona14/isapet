spring:
  application:
    name: isapet-backend
  datasource:
    url: jdbc:h2:mem:isapet;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

app:
  security:
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html