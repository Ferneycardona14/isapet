spring:
  application:
    name: isapet-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/isapet}
    username: ${DB_USERNAME:isapet}
    password: ${DB_PASSWORD:isapet}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

app:
  security:
    cors:
      allowed-origin: ${FRONTEND_ORIGIN:}
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html